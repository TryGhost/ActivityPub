name: Test

on:
  workflow_call:
    inputs:
      skip-tests:
        description: Skip tests
        required: false
        type: boolean
        default: false

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Run Tests
        run: docker compose run --rm migrate-testing up && pnpm test:all

  e2e-shard:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-tests }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run E2E Tests
        run: |
          docker compose run --rm migrate-testing up
          docker compose run --rm cucumber-tests \
            /opt/activitypub/node_modules/.bin/cucumber-js --shard ${{ matrix.shard }}/3

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ !cancelled() && !inputs.skip-tests }}
    steps:
      - name: Check E2E shards passed
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::E2E shards finished with result: ${{ needs.e2e-shard.result }}"
          exit 1
