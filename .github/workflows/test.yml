name: Test

on:
  workflow_call:
    inputs:
      skip-tests:
        description: Skip tests
        required: false
        type: boolean
        default: false

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Download ActivityPub image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: activitypub-amd64
          path: /tmp

      - name: Download Migrations image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: activitypub-migrations-amd64
          path: /tmp

      - name: Load Docker images
        run: |
          docker load < /tmp/activitypub-amd64.tar
          docker load < /tmp/activitypub-migrations-amd64.tar

      - name: Run Tests
        run: docker compose run --rm migrate-testing up && pnpm test:all

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Download ActivityPub image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: activitypub-amd64
          path: /tmp

      - name: Download Migrations image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: activitypub-migrations-amd64
          path: /tmp

      - name: Load Docker images
        run: |
          docker load < /tmp/activitypub-amd64.tar
          docker load < /tmp/activitypub-migrations-amd64.tar

      - name: Run E2E Tests
        run: pnpm test:cucumber
